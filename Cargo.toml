[package]
name = "dorobot-nexus"
version = "0.1.0"
edition = "2021"
description = "Native training studio for GPU reinforcement learning on humanoids"

[[bin]]
name = "dorobot-nexus"
path = "src/main.rs"

[features]
# Drives zealot's GPU biped trainer instead of the built-in CPU learner. It
# adds no dependencies on purpose — zealot is a subprocess, not a crate — so
# this flag only compiles the client that reads its metric stream, and a clean
# clone still builds with nothing but a Rust toolchain. Build the stack with
# scripts/setup-zealot.sh; without it the app falls back to the CPU trainer.
zealot = []

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
# The panel shell and the URDF viewer are shared with DoRobot Studio. Nothing
# else is: the two products meet at an artifact boundary, not a code boundary,
# so the dataset and video machinery stays out of this tree.
makepad-app-shell = { git = "https://github.com/mofa-org/makepad-flex-layout", rev = "78425b1" }
makepad-urdf-player = { git = "https://github.com/dorobot-org/makepad-urdf-viewer", rev = "24bfa8f" }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
