[workspace]
resolver = "2"
members = [
    "crates/nexus-engine",
    "crates/nexus-mujoco",
    "crates/nexus-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nexus-engine = { path = "crates/nexus-engine" }

# The shared visual language, from the dorobot-studio repository. Only the
# console uses it; nexus-engine depends on nothing at all, so the engine's
# bare-clone property survives this even though the full workspace no longer
# has it.
dorobot-ux = { path = "../dorobot-studio/crates/dorobot-ux" }

makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
makepad-app-shell = { git = "https://github.com/mofa-org/makepad-flex-layout", rev = "78425b1" }
# Pinned to the renderer upgrade (registered shadows, menagerie palette,
# checker ground, mirror floor, headlight, smooth normals, base-pose and
# terrain APIs) that the MuJoCo rollout replay needs —
# dorobot-org/makepad-urdf-viewer#2. Re-pin to a main-branch rev once that merges.
makepad-urdf-player = { git = "https://github.com/dorobot-org/makepad-urdf-viewer", rev = "283d303df6d3e158bac2c281a190ac1f749b5bd5" }
rfd = "0.15"

[profile.release]
opt-level = 3
