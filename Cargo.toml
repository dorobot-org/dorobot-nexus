[workspace]
resolver = "2"
members = [
    "crates/nexus-engine",
    "crates/nexus-app",
    "crates/nexus-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nexus-engine = { path = "crates/nexus-engine" }

# The shared visual language, from the dorobot-studio repository. Only the
# studio console uses it; nexus-engine depends on nothing at all and
# nexus-app draws with its own tokens, so the engine's bare-clone property
# survives this even though the full workspace no longer has it.
dorobot-ux = { path = "../dorobot-studio/crates/dorobot-ux" }

makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
makepad-app-shell = { git = "https://github.com/mofa-org/makepad-flex-layout", rev = "78425b1" }
# Pinned to the renderer upgrade (shadow pass, smooth normals, base-pose and
# terrain APIs) that the MuJoCo rollout replay needs — dorobot-org/makepad-urdf-viewer#2.
# Re-pin to a main-branch rev once that merges.
makepad-urdf-player = { git = "https://github.com/dorobot-org/makepad-urdf-viewer", rev = "6a723a2b76bba7e145458138c613e7f9de57f7d8" }
rfd = "0.15"

[profile.release]
opt-level = 3
