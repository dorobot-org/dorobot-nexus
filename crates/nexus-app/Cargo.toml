[package]
name = "nexus-app"
description = "dorobot-nexus's original console: six screens over the engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dorobot-nexus"
path = "src/main.rs"

[dependencies]
nexus-engine = { workspace = true }
makepad-widgets = { workspace = true }
makepad-app-shell = { workspace = true }
makepad-urdf-player = { workspace = true }
log = "0.4"
env_logger = "0.11"

[features]
zealot = ["nexus-engine/zealot"]
